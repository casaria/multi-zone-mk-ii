    text_sensor:
      - platform: wifi_info
        ip_address:
          name: "${friendly_name} IP Address"

      - platform: template
        name: "${friendly_name} Uptime"
        id: uptime_human
        icon: mdi:clock-start
        update_interval: 60s
        lambda: |-
          uint32_t s = millis() / 1000;
          uint32_t d = s / 86400; s %= 86400;
          uint32_t h = s / 3600;  s %= 3600;
          uint32_t m = s / 60;    s %= 60;
          char buf[32];
          snprintf(buf, sizeof(buf), "%ud %02uh %02um %02us", d, h, m, s);
          return {buf};

      - platform: template
        name: "Air Quality Category"
        id: iaq_category
        icon: "mdi:leaf"
        lambda: 'return {"Initializing..."};'

    interval:
      # Re-evaluate every 60 seconds even if the original state does not change
      - interval: 30s
        then:
          - script.execute: update_f1_coordinator


      - interval: 60 s
        then:
          - if:
              condition:
                binary_sensor.is_on: AC1_power
              then:
                - if:
                    condition:
                      lambda: "return id(AC1_fanfreq).state < 95;"
                    then:
                      - script.execute: update_f1_coordinator
                      - binary_sensor.template.publish:
                          id: AC1_FAN_rpm_fault
                          state: ON
                      - logger.log:
                          format: "AC1 fan RPM too low: %.0f rpm (unit ON)"
                          args: ["id(AC1_fanfreq).state"]
                      - mqtt.publish:
                          topic: HVAC_MULTI_Z/floor1/ac/alert
                          payload: "FAN_AC1_LOW_RPM"
                          qos: 1
                      - delay: 5 s
                      - mqtt.publish:
                          topic: ${faikin_ac1}/command
                          payload: "{\"power\":false}"
                          qos: 1
                          retain: false
                      - delay: 5 s
                      - mqtt.publish:
                          topic: ${faikin_ac1}/command
                          payload: "{\"power\":true}"
                          qos: 1
                          retain:  false

                    else:
                      - script.execute: update_f2_coordinator
                      - binary_sensor.template.publish:
                          id: AC1_FAN_rpm_fault
                          state: OFF

              else:
                # unit is off — clear any fault, nothing to check

                - binary_sensor.template.publish:
                    id: AC1_FAN_rpm_fault
                    state: OFF

          - if:
              condition:
                binary_sensor.is_on: AC2_power
              then:
                - if:
                    condition:
                      lambda: "return id(AC2_fanfreq).state < 95;"
                    then:
                      - binary_sensor.template.publish:
                          id: AC2_FAN_rpm_fault
                          state: ON

                      - logger.log:
                          format: "AC 2 fan RPM too low: %.0f rpm (unit ON)"
                          args: ["id(AC2_fanfreq).state"]
                      - mqtt.publish:
                          topic: HVAC_MULTI_Z/floor2/ac/alert
                          payload: "AC2_FAN_LOW_RPM"
                          qos: 1
                      - delay: 5s
                      - mqtt.publish:
                          topic: ${faikin_ac2}/command
                          payload: "{\"power\":false}"
                          qos: 1
                          retain: false

                      - delay: 20s
                      - mqtt.publish:
                          topic: ${faikin_ac2}/command
                          payload: "{\"power\":true}"
                          qos: 1
                          retain: false
                    else:
                      - binary_sensor.template.publish:
                          id: AC2_FAN_rpm_fault
                          state: OFF


              else:
                # unit is off — clear any fault, nothing to check
                - binary_sensor.template.publish:
                    id: AC2_FAN_rpm_fault
                    state: OFF

    # ─── TIME ─────────────────────────────────────────────────────────────────────
    time:
      - platform: sntp
        id: current_time

    # ─── LIGHTS ───────────────────────────────────────────────────────────────────
    light:
      - platform: esp32_rmt_led_strip
        rgb_order: GRB
        pin: GPIO48
        num_leds: 1
        chipset: ws2812
        id: RGB_LED
        name: "RGB_LED"
        effects:
          - pulse:

      - platform: monochromatic
        output: led_status_rgb
        name: "led_status_rgb"
        effects:
          - pulse:
              name: "Fast Pulse"
              transition_length: 0.5s
              update_interval: 0.5s

              min_brightness: 0%
              max_brightness: 100%
          - pulse:
              name: "Slow Pulse"
              transition_length: 2s
              update_interval: 2s
              min_brightness: 10%
              max_brightness: 100%
          - pulse:
              name: "Asymmetrical Pulsef"
              transition_length:
                on_length: 1s
                off_length: 500ms
              update_interval: 1.5s
              min_brightness: 0%
              max_brightness: 100%
